<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Novo Tópico - Fórum Anônimo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h2 mb-0">Criar Novo Tópico</h1>
                <div>
                    <span id="userNickname" class="badge bg-secondary me-2"></span>
                    <a href="index.html" class="btn btn-secondary">Voltar</a>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <form id="createThreadForm">
                            <div class="mb-3">
                                <label for="threadTitle" class="form-label">Título do Tópico</label>
                                <input type="text" class="form-control bg-dark text-white" id="threadTitle" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="threadContent" class="form-label">Conteúdo (Markdown)</label>
                                <textarea class="form-control bg-dark text-white" id="threadContent" rows="10" required></textarea>
                                <div class="form-text">
                                    Você pode usar Markdown para formatação. 
                                    Para imagens: ![alt text](URL da imagem)
                                </div>
                            </div>

                            <div class="mb-3">
                                <h6>Preview:</h6>
                                <div id="contentPreview" class="border p-3 rounded bg-dark" style="min-height: 100px;">
                                    Digite algo acima para ver o preview...
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <span id="submitText">Criar Tópico</span>
                                <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            
            // Live preview
            const contentTextarea = document.getElementById('threadContent');
            const preview = document.getElementById('contentPreview');
            
            contentTextarea.addEventListener('input', function() {
                const markdownContent = this.value;
                if (markdownContent.trim()) {
                    preview.innerHTML = marked.parse(markdownContent);
                } else {
                    preview.innerHTML = 'Digite algo acima para ver o preview...';
                }
            });

            // Form submission
            document.getElementById('createThreadForm').addEventListener('submit', function(e) {
                e.preventDefault();
                createThread();
            });
        });
    </script>
</body>
</html>

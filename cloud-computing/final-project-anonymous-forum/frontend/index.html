<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum Anônimo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h2 mb-0">O Fórum Sem Nome 
                    <img width="40" src="https://88by31.neocities.org/misc/mishtery.gif"><img>
                </h1>
                <div>
                    <span id="userNickname" class="badge bg-secondary me-2"></span>
                    <a href="create-post.html" class="btn btn-primary">Criar Novo Tópico</a>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Tópicos Recentes</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="threadsLoading" class="text-center p-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>
                        <div id="threadsList" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        // Load user nickname and threads on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadThreads();
        });
    </script>
</body>
</html>

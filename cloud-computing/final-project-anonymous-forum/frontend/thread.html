<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tópico - Fórum Anônimo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h2 mb-0" id="threadTitle">Carregando...</h1>
                <div>
                    <span id="userNickname" class="badge bg-secondary me-2"></span>
                    <a href="index.html" class="btn btn-secondary">Voltar ao Fórum</a>
                </div>
            </div>
        </header>

        <div class="row">
            <div class="col-12">
                <!-- Original Thread -->
                <div class="card mb-4" id="originalThread">
                    <div id="threadContent" class="card-body">
                        <div class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Posts -->
                <div id="postsContainer">
                    <!-- Posts will be loaded here -->
                </div>

                <!-- Reply Form -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Responder</h5>
                    </div>
                    <div class="card-body">
                        <form id="replyForm">
                            <div class="mb-3">
                                <label for="replyContent" class="form-label">Sua resposta (Markdown)</label>
                                <textarea class="form-control bg-dark text-white" id="replyContent" rows="6" required></textarea>
                            </div>

                            <div class="mb-3">
                                <h6>Preview:</h6>
                                <div id="replyPreview" class="border p-3 rounded bg-dark" style="min-height: 80px;">
                                    Digite algo acima para ver o preview...
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary" id="replyBtn">
                                <span id="replyText">Responder</span>
                                <span id="replySpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            
            const urlParams = new URLSearchParams(window.location.search);
            const threadId = urlParams.get('id');
            
            if (threadId) {
                loadThread(threadId);
            } else {
                window.location.href = 'index.html';
            }
            
            // Live preview for replies
            const replyTextarea = document.getElementById('replyContent');
            const replyPreview = document.getElementById('replyPreview');
            
            replyTextarea.addEventListener('input', function() {
                const markdownContent = this.value;
                if (markdownContent.trim()) {
                    replyPreview.innerHTML = marked.parse(markdownContent);
                } else {
                    replyPreview.innerHTML = 'Digite algo acima para ver o preview...';
                }
            });

            // Reply form submission
            document.getElementById('replyForm').addEventListener('submit', function(e) {
                e.preventDefault();
                replyToThread(threadId);
            });
        });
    </script>
</body>
</html>
